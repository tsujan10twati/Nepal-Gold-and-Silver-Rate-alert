name: Gold & Silver price bot

on:
  schedule:
    # GitHub cron uses UTC; Nepal time is UTC+5:45.
    # 04:15, 05:15, 07:15 UTC = 10:00 AM, 11:00 AM, 1:00 PM Nepal time.
    - cron: "15 4,5,7 * * *"
  workflow_dispatch: # manual run from the Actions tab sends the current price as a test

permissions:
  contents: write # lets the job commit state.json

concurrency:
  group: gold-bot
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check prices and notify
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python bot.py --force
          else
            python bot.py --once
          fi

      - name: Save last-seen prices
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "gold-bot"
            git config user.email "gold-bot@users.noreply.github.com"
            git add state.json
            git commit -m "Update prices"
            git push
          fi
