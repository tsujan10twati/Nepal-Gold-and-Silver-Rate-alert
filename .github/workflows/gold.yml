name: Gold & Silver price bot

on:
  schedule:
    # GitHub cron uses UTC; Nepal time is UTC+5:45.
    # Every 15 minutes from 10:07 AM to 1:52 PM Nepal time (UTC+5:45), daily.
    # Odd minutes avoid the busy :00/:15 UTC slots GitHub often skips.
    - cron: "22,37,52 4 * * *"      # 10:07, 10:22, 10:37 NPT
    - cron: "7,22,37,52 5-7 * * *"  # 10:52 AM - 1:37 PM NPT
    - cron: "7 8 * * *"             # 1:52 PM NPT
  workflow_dispatch: # manual run from the Actions tab sends the current price as a test

permissions:
  contents: write # lets the job commit state.json

concurrency:
  group: gold-bot
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check prices and notify
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python bot.py --force
          else
            python bot.py --once
          fi

      - name: Save last-seen prices
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "gold-bot"
            git config user.email "gold-bot@users.noreply.github.com"
            git add state.json
            git commit -m "Update prices"
            git push
          fi
